name: Math Lab Regression

on:
  push:
    paths:
      - 'math-lab/**'
      - 'functions/**'
      - 'firestore.rules'
      - 'firebase.json'
      - 'test-quiz-engine.js'
      - '.github/workflows/math-lab.yml'
      - '.github/scripts/math-lab-regression.js'
  pull_request:
    paths:
      - 'math-lab/**'
      - 'functions/**'
      - 'firestore.rules'
      - 'firebase.json'
      - 'test-quiz-engine.js'
      - '.github/workflows/math-lab.yml'
      - '.github/scripts/math-lab-regression.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Math Lab tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Java 21 for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install emulator test dependencies
        run: npm install --no-save @firebase/rules-unit-testing firebase

      - name: Run Math Lab regression
        run: node .github/scripts/math-lab-regression.js

      - name: Run trusted Functions unit tests
        run: node --test functions/test/*.test.js

      - name: Run Firestore Emulator security tests
        run: npx --yes firebase-tools@latest emulators:exec --only firestore --project demo-math-lab "node math-lab/tests/firestore-rules-emulator.test.js"

      - name: Run Game System regression
        run: node test-quiz-engine.js
